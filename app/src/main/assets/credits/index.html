<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>credits</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="credits-modal" id="modal">
  <div class="credits-rain"><canvas id="rain-canvas"></canvas></div>
  <div class="credits-viewport" id="viewport">
    <div class="credits-roll" id="roll"></div>
  </div>
  <div class="credits-movement" id="movement-label"></div>
  <div class="credits-chrome">
    <button type="button" id="mute-btn" aria-pressed="false" aria-label="mute">&#128266;</button>
    <button type="button" id="close-btn" aria-label="close">&#10005;</button>
  </div>
  <!-- Bottom right, opposite the chrome (vjt, #grappa: "in basso a dx?") — one-
       press buttons up top, a held one down here, so a mis-tap can't reach
       mute/close mid-hold. Press and hold, not a toggle: see main.js. -->
  <div class="credits-ff">
    <button type="button" id="ff-btn" class="credits-ff-button" aria-pressed="false" aria-label="fast forward the credits">&#9193;</button>
  </div>
</div>
<!-- Generated at build time by the resentin-credits GitHub Actions step
     (scripts/credits.sh) from `git shortlog`. Falls back to an empty roll
     when absent (a local/dev build that skipped the step) — see
     creditsText.js's buildResentinBlock(). -->
<script src="credits-data.js"></script>
<!-- Classic scripts sharing one global scope, not ES modules — see main.js's
     header comment: `type="module"` imports across file:// resources are
     blocked by CORS in a WebView and fail silently. Order matters: each
     later file reads names declared by the ones before it. -->
<script src="creditsAudio.js"></script>
<script src="creditsText.js"></script>
<script src="matrixRain.js"></script>
<script src="main.js"></script>
</body>
</html>
