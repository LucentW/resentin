[package]
name = "vodozemac_android"
version = "0.0.0"
edition = "2024"
publish = false
description = "UniFFI binding over vodozemac for Resentin's E2E (mirrors grappa-irc cicchetto/wasm/vodozemac-binding)"

[lib]
crate-type = ["cdylib", "lib"]
name = "vodozemac_android"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
vodozemac = "=0.11.1"
uniffi = { version = "0.29", features = ["cli"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
