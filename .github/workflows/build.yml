name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone — scripts/credits.sh
          # below reads it via `git shortlog` for the /credits contributor
          # roll, and a shallow clone would silently bake a near-empty one.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The E2E crypto is a Rust library (rust/vodozemac-android) that ships as .so files per ABI.
      # They are not in the repository: without this the APK builds fine and then every
      # encrypted-chat call dies with UnsatisfiedLinkError at runtime.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vodozemac-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust crypto library
        run: ./scripts/build-rust.sh

      - name: Generate /credits contributor roll
        run: ./scripts/credits.sh

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: resentin-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Build and publish signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The E2E crypto is a Rust library (rust/vodozemac-android) that ships as .so files per ABI.
      # They are not in the repository: without this the APK builds fine and then every
      # encrypted-chat call dies with UnsatisfiedLinkError at runtime.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/vodozemac-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust crypto library
        run: ./scripts/build-rust.sh

      - name: Generate /credits contributor roll
        run: ./scripts/credits.sh

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/resentin-release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/resentin-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: resentin-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

  fdroid:
    name: Publish the F-Droid repository
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    secrets: inherit
